[package]
name = "springboot-gen"
version = "0.1.0"
edition = "2021"
authors = ["Visal Som"]
description = "Boilerplate Spring Boot project generator with infrastructure composition"
repository = "https://github.com/Solo-Ranker/springboot-gen"
license = "MIT"

[[bin]]
name = "springboot-gen"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "color", "wrap_help"] }
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
indicatif = { version = "0.18.4", features = ["improved_unicode"] }
console = "0.16.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "1.0"

# Template rendering
handlebars = "6.4.0"

# File system
walkdir = "2.5"

# Error handling
anyhow = "1.0"
thiserror = "2.0.18"

# Utilities
regex = "1.10"
semver = { version = "1.0", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
indexmap = { version = "2.2", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.4"
tempfile = "3.26.0"
