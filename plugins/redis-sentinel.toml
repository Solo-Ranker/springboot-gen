category = "Data Layer"
conflicts = [
    "redis",
    "redis-cluster",
]
description = "Redis with Sentinel for automatic failover"
key = "redis-sentinel"
name = "Redis (Sentinel HA)"
requires = []

[[docker_services]]
depends_on = []
healthcheck = "redis-cli ping"
image = "redis:7.2-alpine"
name = "redis-master"
ports = ["6379:6379"]
volumes = ["redis_master_data:/data"]

[docker_services.environment]

[[docker_services]]
depends_on = ["redis-master"]
healthcheck = "redis-cli ping"
image = "redis:7.2-alpine"
name = "redis-replica-1"
ports = ["6380:6379"]
volumes = ["redis_replica1_data:/data"]

[docker_services.environment]

[[docker_services]]
depends_on = [
    "redis-master",
    "redis-replica-1",
]
healthcheck = "redis-cli -p 26379 ping"
image = "redis:7.2-alpine"
name = "redis-sentinel-1"
ports = ["26379:26379"]
volumes = []

[docker_services.environment]

[env_vars]
REDIS_DB = "0"
REDIS_PASSWORD = ""
REDIS_SENTINEL_MASTER = "mymaster"
REDIS_SENTINEL_NODES = "localhost:26379,localhost:26380,localhost:26381"
REDIS_SENTINEL_PASSWORD = ""

[java_files]
"redis/CacheConfig" = "config/CacheConfig"
"redis/RedisProperties" = "config/properties/RedisProperties"
"redis/RedisSentinelConfig" = "config/RedisSentinelConfig"

[[maven_deps]]
artifact_id = "spring-boot-starter-data-redis"
group_id = "org.springframework.boot"

[[maven_deps]]
artifact_id = "lettuce-core"
group_id = "io.lettuce"

[[maven_deps]]
artifact_id = "commons-pool2"
group_id = "org.apache.commons"
